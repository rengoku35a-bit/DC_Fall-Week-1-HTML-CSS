<!-- 
  🧱 PROFILE CARD (EDUCATIONAL STARTER)
  HTML = structure (what things are). Tailwind CSS = style (how they look).
  Try changing the text, colors, or spacing classes and watch it update!
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile Card</title>
    <!-- Tailwind CSS via CDN (no install needed) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-start justify-center bg-gray-600 pt-16">

  <!-- Inner <div>: this is the "card" box that holds all the content -->
  <div class="max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl">

    <!-- <img>: Displays an image. 
         The "src" is the image link. 
         The "alt" text is shown if the image doesn't load. -->
    <img 
      src= https://upload.wikimedia.org/wikipedia/en/2/21/Web_of_Spider-Man_Vol_1_129-1.png?20180911185634
      alt="Web-Head"
      class="mx-auto mb-4 h-30 w-30 rounded-full"
    />

    <!-- <h1>: Heading tag (used for titles). 
         Larger headings have lower numbers: <h1> is biggest, <h6> is smallest. -->
    <h1 class="text-2xl font-bold text-black-600">Spidey</h1>

    <!-- <p>: Paragraph tags hold blocks of text. -->
    <p class="mt-2 text-gray-600">Your Friendly Neighborhood Spider-Man</p>
    <p class="mt-1 text-sm text-gray-500">"Its pizza time"</p>

    <!-- <a>: Anchor tag = link. 
         "href" tells it where to go when clicked.
         "target='_blank'" opens the link in a new tab. -->
    <a 
      href="https://github.com/YOUR-USERNAME-HERE" 
      target="_blank"
      class="mt-4 inline-block rounded-lg bg-blue-500 px-4 py-2 text-white transition hover:bg-blue-600"
    >
      Visit My GitHub
    </a>

<!-- 📊 Data Storytelling Project Card -->
<section class="mt-8 rounded-2xl bg-white/90 p-5 shadow-md ring-1 ring-gray-200 max-w-xl mx-auto">
  <h3 class="text-lg font-semibold text-gray-900">📊 Data Storytelling — Heroes & Animals</h3>
  <p class="text-sm text-gray-600 mt-2">
    The Wolverine has a height of 37.5.
  </p>
  <div class="mt-4 flex gap-3">
    <a href="https://colab.research.google.com/github/The-Pritzker-Tech-Talent-Labs/DC_Fall-Week-2-Data-Analysis/blob/main/animal_endangered_lesson.ipynb#scrollTo=DIn0dz0-Fwj-"
       target="_blank"
       class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 transition">
      🔗 Open Notebook
    </a>
   
  </div>

  </div> <!-- closes card div -->
  </body>
</html>
